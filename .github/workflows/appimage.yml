name: linux-appimage

# For a version tag (v1.0.0): builds the AppImage, publishes it to that release (which the auto-updater reads), and
# adds the AppImage in a zip, which is what the Linux copy checks for updates. Any other run only builds it, so the
# AppImage can be downloaded and tested from the run page.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Plugin checks
        run: npm run check
      # Whichever workflow gets there first creates the release, with the changelog as its notes.
      - name: Make sure the release exists
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Yapnap $GITHUB_REF_NAME" --notes-file CHANGELOG.md || gh release view "$GITHUB_REF_NAME" >/dev/null
      - name: Build and publish the AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --linux AppImage --publish always
      - name: Zip the AppImage and upload the zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist
          zip -j "Yapnap-${VERSION}-AppImage.zip" "Yapnap-${VERSION}.AppImage"
          gh release upload "$GITHUB_REF_NAME" "Yapnap-${VERSION}-AppImage.zip" --clobber
      - name: Build the AppImage (not published)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Yapnap-AppImage
          path: |
            dist/*.AppImage
            dist/*.blockmap
            dist/latest-linux.yml
