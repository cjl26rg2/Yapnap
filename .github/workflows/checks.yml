name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Skips the Electron download, which the checks do not need.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Plugin checks (Yapnap's own plugins)
        run: npm run check
